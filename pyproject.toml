[tool.poetry]
name = "valutatrade-hub"
version = "0.2.1"
description = "Crypto portfolio CLI with currency exchange"
authors = ["Rassokhin Vladislav <rassokhinvladislav@mail.ru>"]
readme = "README.md"

packages = [
    { include = "valutatrade_hub" }
]

[tool.poetry.scripts]
valutatrade = "valutatrade_hub.cli.interface:run_cli"

[tool.poetry.dependencies]
python = "^3.12"
prettytable = "^3.17.0"
tomli = "^2.0.1"  # для чтения pyproject.toml в Python <3.11
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "pycache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

# ================================
# 🎯 Настройки valutatrade_hub
# ================================
[tool.valutatrade]
data_path = "data/"
rates_ttl_seconds = 3600
default_base_currency = "USD"
log_path = "logs/app.log"