[tool.poetry]
name = "project-3-rassokhin-m25-555"
version = "0.1.1"
description = ""
authors = ["Rassokhin Vladislav <rassokhinvladislav@mail.ru>"]
readme = "README.md"

packages = [
     { include = "src" },
 ]

[tool.poetry.scripts]
database = "src.primitive_db.main:main"


[tool.poetry.dependencies]
python = "^3.12"
prompt = "^0.4.1"
prettytable = "^3.17.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "pycache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []